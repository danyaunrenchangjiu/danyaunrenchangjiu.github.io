# Butterfly theme configuration for the PhD blog.

nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: true

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-user-graduate

code_blocks:
  theme: light
  macStyle: true
  height_limit: 420
  word_wrap: true
  copy: true
  language: true
  shrink: false
  fullpage: true

social:
  fas fa-envelope: mailto:your-email@example.com || Email || "#2f7d78"

favicon: /img/avatar.svg

avatar:
  img: /img/avatar.svg
  effect: true

disable_top_img: false
default_top_img: https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&w=1800&q=80
index_img: https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1800&q=80
archive_img: https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=1800&q=80
tag_img: https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=1800&q=80
category_img: https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=1800&q=80
footer_img: false

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=1200&q=80
    - https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=1200&q=80
    - https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=80

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

index_site_info_top: 42%
index_top_img_height: 56vh

subtitle:
  enable: true
  effect: true
  typed_option:
  source: false
  sub:
    - 把博士生活写成可复盘的研究日志
    - 记录论文、实验、代码和方法论
    - 慢慢搭建自己的科研工具箱

index_layout: 3
index_post_content:
  method: 2
  length: 220

toc:
  post: true
  page: true
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

related_post:
  enable: true
  limit: 6
  date_type: created

noticeOutdate:
  enable: true
  style: flat
  limit_day: 365
  position: top
  message_prev: 本文距离上次更新已过去
  message_next: 天，部分经验可能需要结合最新工具或论文重新确认。

footer:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
    version: true
  custom_text: 以长期主义记录博士训练。

aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 博士生 / 科研方法收藏者 / 持续复盘实验与写作
    button:
      enable: false
      icon: fab fa-github
      text: GitHub
      link:
  card_announcement:
    enable: true
    content: 这里记录博士生活、科研技巧、文献阅读、实验复盘和代码笔记。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: true
    orderby: random
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: YYYY 年 MM 月
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    runtime_date: 08/16/2026 00:00:00

readmode: true
darkmode:
  enable: true
  button: true
  autoChangeMode: false

copy:
  enable: true
  copyright:
    enable: false
    limit_count: 150

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

math:
  use: mathjax
  per_page: false
  hide_scrollbar: false
  mathjax:
    enableMenu: true
    tags: none

search:
  use: local_search
  placeholder: 搜索论文、实验、代码、生活记录
  local_search:
    preload: false
    top_n_per_article: 2
    unescape: false
    pagination:
      enable: false
      hitsPerPage: 8

comments:
  use:
  text: true
  lazyload: false
  count: false
  card_post_count: false

theme_color:
  enable: true
  main: "#2f7d78"
  paginator: "#b75d69"
  button_hover: "#d6a15d"
  text_selection: "#d9efed"
  link_color: "#2f7d78"
  meta_color: "#687076"
  hr_color: "#d8e7e4"
  code_foreground: "#b75d69"
  code_background: "rgba(47, 125, 120, .08)"
  toc_color: "#2f7d78"
  blockquote_padding_color: "#2f7d78"
  blockquote_background_color: "#eef7f5"
  scrollbar_color: "#2f7d78"
  meta_theme_color_light: "#f7fbfa"
  meta_theme_color_dark: "#121820"

rounded_corners_ui: true
text_align_justify: false
mask:
  header: true
  footer: true

display_mode: light

beautify:
  enable: true
  field: post
  title_prefix_icon: "\f02d"
  title_prefix_icon_color: "#2f7d78"

font:
  global_font_size: 16px
  code_font_size: 14px
  font_family:
  code_font_family: "JetBrains Mono, Consolas, Monaco, monospace"

hr_icon:
  enable: true
  icon:
  icon_top:

mermaid:
  enable: true
  code_write: true
  theme:
    light: default
    dark: dark
  open_in_new_tab: true
  zoom_pan: true

note:
  style: flat
  icons: true
  border_radius: 4
  light_bg_offset: 0

pjax:
  enable: false

lazyload:
  enable: true
  native: true
  field: site

Open_Graph_meta:
  enable: true

inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:

CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: true
